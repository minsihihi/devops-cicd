# dir로 가져가는 pod
# 주의사항 : 기존 dir 안의 파일은 전부 감춰진다 !! (원래 있어야하는 파일이 전부 없어짐)
# 이걸 피하려면 cm volume file을 사용해야한다.
# kubetemp/configmap-volume-dir-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: nginx-configvol
spec:
  containers:
  - image: nginx:1.7.9
    name: web-server
    volumeMounts:
    - name: config
      # nginx의 설정 파일이 모여있는 dir
      mountPath: /etc/nginx/conf.d
      readOnly: true
    ports:
    - containerPort: 8080
      protocol: TCP
  volumes:
  # volume으로 마운트 >> disk로 인지하기 때문에 config 명명을 2번
  - name: config
    configMap:
      name: nginx-config