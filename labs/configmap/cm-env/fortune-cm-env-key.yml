# key 값으로 env를 받아온다.
# configmap을 kaymap으로 생성
# kubetemp/config-fortune-mapenv-key-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: fortune7s-key
spec:
  containers:
  - image: dangtong/fortune:env
    env:
    - name: INTERVAL
      valueFrom:
        configMapKeyRef:
          name: fortune-config
          key: sleep-interval # >> 환경변수 INTERVAL에 들어가서, 이 key는 INTERVAL이라는 env로만 조회된다.
    name: html-generator
    volumeMounts:
    - name: html
      mountPath: /var/htdocs
  - image: nginx:alpine
    name: web-server
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
      readOnly: true
    ports:
    - containerPort: 80
      protocol: TCP
  volumes:
  - name: html
    emptyDir: {}