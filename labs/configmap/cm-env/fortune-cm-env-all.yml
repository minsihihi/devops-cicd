# kubetemp/config-fortune-mapenv-all-pod.yaml
# key가 환경변수 이름이 되고 value는 따로 있다.
# 여러개가 들어가면 전부 다 가져간다. (key ref는 특정 것만 집어낸다.)
apiVersion: v1
kind: Pod
metadata:
  name: fortune7s-all
spec:
  containers:
  - image: dangtong/fortune:env
    envFrom:
    - configMapRef:
        name: fortune-config # >> configmap 에 다 들어간다.
    name: html-generator
    volumeMounts:
    - name: html
      mountPath: /var/htdocs
  - image: nginx:alpine
    name: web-server
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
      readOnly: true
    ports:
    - containerPort: 80
      protocol: TCP
  volumes:
  - name: html
    emptyDir: {}
