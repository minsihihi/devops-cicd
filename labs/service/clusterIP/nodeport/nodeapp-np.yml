# nodeport의 nw에는 못들어간다. --> k8s의 private nw IP가 할당돼서

apiVersion: v1
kind: Service
metadata:
  name: node-nodeport
spec:
  type: NodePort
  ports:
  # taffic income 순서 : np>port>targetport
  - nodePort: 30123
    port: 80
    # np를 설정하면 자동으로 할당되는 클러스터 IP가 받는 포트
    targetPort: 8080
  selector:
    app:  nodeapp-pod