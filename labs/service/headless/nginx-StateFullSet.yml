# Address 1: 10.1.5.143 web-2.nginx.default.svc.cluster.local
# Address 2: 10.1.5.105 web-0.nginx.default.svc.cluster.local
# Address 3: 10.1.6.218 web-1.nginx.default.svc.cluster.local
# >> svc nave으로 url이 생성된 모습