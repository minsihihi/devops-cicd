# nginx-sts.yml
# deployment와 유사하다고 생각

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
# 이런 이름의 url이 dns에 저장됨
  serviceName: "nginx"
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web

# dns 확인용: kubectl run test-dns --image=busybox:1.28 --rm -it --restart=Never -- nslookup nginx
