# 이번에는 yml 하나로 ---구분선 사용해서 합침
# 하나 파일이 2개처럼 동작
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp-deployment
  labels:
    app: nodeapp
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nodeapp-pod
  template:
    metadata:
      labels:
        app: nodeapp-pod
    spec:
      containers:
      - name: nodeapp-container
        image: dangtong/nodeapp
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name:  nodeapp-lb
  # LB는 반드시 annotation이 필요하다.
  # LB 설정을 써놔야 aws LB controller가 읽고 그에 맞게 LB를 구현한다.
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external # VPC 외부 접속 가능
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip # 노드가 아니라 POD ip로 직접 전달
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # 공인 IP 사용
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: nodeapp-pod



# aws elbv2 describe-load-balancers 
# CMD로 LB된 url 확인하고, 그 경로로 접속이 가능하다.